<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1220">
    <title>Sequence trial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../styles.css?v=20261020c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32x32.png">
</head>

<body>
    <div class="app-shell">
        <main class="app-main">
            <div class="page max-w-full px-4 lg:px-8 mx-auto" id="sequence-spike">
                <header class="py-2 mb-2 flex flex-wrap items-center justify-between gap-2 border-b border-slate-200">
                    <div class="flex items-center gap-2 min-w-0">
                        <h1 class="text-base font-bold text-slate-900 tracking-tight">Sequence trial</h1>
                        <span class="text-xs text-slate-400 hidden sm:inline">|</span>
                        <span id="current-match-badge" class="text-xs font-semibold text-slate-700 bg-slate-100 px-2 py-0.5 rounded border border-slate-200 truncate max-w-[220px]">Sample match</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button type="button" id="feedback-badge-btn" class="hidden btn btn-compact text-xs bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 font-semibold flex items-center gap-1.5 shadow-sm transition-all" title="View flagged clips">
                            <i class="fas fa-flag text-amber-600 text-[11px]" aria-hidden="true"></i>
                            <span id="feedback-badge-count">0 Flagged</span>
                        </button>
                        <button type="button" id="matches-button" class="btn btn-secondary btn-compact text-xs flex items-center gap-1.5" title="Switch match or upload">
                            <i class="fas fa-folder-open text-slate-500" aria-hidden="true"></i>Matches
                        </button>
                    </div>
                </header>

                <!-- Analysis Workspace: Video (sticky) + Filtered Entries -->
                <div id="report"></div>

                <!-- Matches Modal / Drawer -->
                <div id="matches-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden" role="dialog" aria-modal="true" aria-labelledby="matches-modal-title">
                    <div class="surface rounded-xl shadow-2xl max-w-md w-full p-4 sm:p-5 flex flex-col gap-3.5 border border-slate-200 max-h-[90vh] overflow-y-auto">
                        <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                            <div class="flex items-center gap-2">
                                <i class="fas fa-folder-open text-brand text-xs" aria-hidden="true"></i>
                                <h2 id="matches-modal-title" class="text-sm font-bold text-slate-900">Switch Match</h2>
                            </div>
                            <button type="button" id="close-matches-modal" class="btn btn-ghost btn-compact text-slate-400 hover:text-slate-700 text-sm px-2 py-0.5" aria-label="Close">✕</button>
                        </div>

                        <!-- Sample Match Hero -->
                        <button type="button" id="sample-button" class="btn btn-primary w-full py-2.5 px-4 text-xs font-bold flex items-center justify-center gap-2 shadow-sm">
                            <i class="fas fa-play text-xs" aria-hidden="true"></i>Explore Sample Match (Fire vs Pride)
                        </button>

                        <!-- Saved Matches Section -->
                        <div class="flex flex-col gap-1.5">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Saved in this browser</span>
                            <div id="saved-games" class="flex flex-col gap-1.5 text-xs max-h-48 overflow-y-auto"></div>
                        </div>

                        <!-- Upload Section -->
                        <div class="pt-2 border-t border-slate-100 flex flex-col gap-2">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Upload new match</span>
                            <button type="button" id="upload-button" class="btn btn-secondary w-full py-2 text-xs flex items-center justify-center gap-1.5 border-dashed border-2 hover:border-slate-400">
                                <i class="fas fa-cloud-arrow-up text-slate-500 text-xs" aria-hidden="true"></i>Upload match export (.xml or .json)
                            </button>
                            <input id="file-input" type="file" accept=".xml,.json,application/json,text/xml,application/xml" class="hidden" aria-label="Match export">
                        </div>

                        <p id="status" class="help-text text-xs text-center text-slate-500" role="status"></p>
                    </div>
                </div>

                <!-- Feedback Batch Modal -->
                <div id="feedback-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden" role="dialog" aria-modal="true" aria-labelledby="feedback-modal-title">
                    <div class="surface rounded-xl shadow-2xl max-w-md w-full p-4 sm:p-5 flex flex-col gap-3.5 border border-slate-200 max-h-[90vh] overflow-y-auto">
                        <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                            <div class="flex items-center gap-2">
                                <i class="fas fa-flag text-amber-600 text-xs" aria-hidden="true"></i>
                                <h2 id="feedback-modal-title" class="text-sm font-bold text-slate-900">Flagged Sequences</h2>
                                <span id="feedback-modal-count-badge" class="px-2 py-0.2 rounded-full text-[10px] font-bold bg-amber-100 text-amber-900 border border-amber-300">0</span>
                            </div>
                            <button type="button" id="close-feedback-modal" class="btn btn-ghost btn-compact text-slate-400 hover:text-slate-700 text-sm px-2 py-0.5" aria-label="Close">✕</button>
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <button type="button" id="copy-feedback-batch-btn" class="btn btn-primary btn-compact text-xs font-semibold flex items-center gap-1.5 flex-1 justify-center">
                                <i class="fas fa-clipboard text-xs" aria-hidden="true"></i>Copy Batch for AI
                            </button>
                            <button type="button" id="download-feedback-batch-json" class="btn btn-secondary btn-compact text-xs font-semibold flex items-center gap-1.5">
                                <i class="fas fa-download text-xs" aria-hidden="true"></i>JSON
                            </button>
                            <button type="button" id="clear-feedback-batch-btn" class="btn btn-ghost btn-compact text-xs text-rose-600 hover:bg-rose-50 font-semibold">
                                Clear all
                            </button>
                        </div>

                        <div id="feedback-copy-status" class="text-xs text-emerald-700 font-medium hidden text-center bg-emerald-50 py-1.5 rounded border border-emerald-200">
                            ✓ Copied Markdown to clipboard! Ready to paste into chat.
                        </div>

                        <!-- List of flagged items preview -->
                        <div class="flex flex-col gap-2 max-h-56 overflow-y-auto border-t border-slate-100 pt-2" id="feedback-items-list"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="./page.js"></script>
</body>

</html>
