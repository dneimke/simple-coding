<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1220">
    <title>Sequence trial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../styles.css?v=20261020c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32x32.png">
</head>

<body>
    <div class="app-shell">
        <main class="app-main">
            <div class="page max-w-full px-4 lg:px-8 mx-auto" id="sequence-spike">
                <header class="py-2.5 mb-2 flex flex-wrap items-center justify-between gap-2 border-b border-slate-200">
                    <div class="flex items-center gap-2">
                        <h1 class="text-base font-bold text-slate-900 tracking-tight">Sequence trial</h1>
                        <span class="text-xs text-slate-400 hidden sm:inline">|</span>
                        <span class="text-xs text-slate-500 hidden sm:inline">Attacking Entries (A25E & CE) Counter vs Build-Up</span>
                    </div>
                    <a class="btn btn-secondary btn-compact text-xs" href="../../index.html#saved-games">Matches</a>
                </header>

                <!-- Choose a match (collapsible after load) -->
                <details id="match-selector-details" class="surface px-3 py-2 mb-2.5 border rounded-lg group" open>
                    <summary class="flex items-center justify-between cursor-pointer list-none select-none font-semibold text-xs text-slate-800">
                        <span class="flex items-center gap-2">
                            <i class="fas fa-folder-open text-brand" aria-hidden="true"></i>
                            <span id="match-selector-title">Choose a match</span>
                        </span>
                        <i class="fas fa-chevron-down text-slate-400 text-xs transition-transform group-open:rotate-180" aria-hidden="true"></i>
                    </summary>
                    <p class="help-text mt-1 text-xs">Use a match saved in this browser, upload an export (.xml or .json), or open the sample.</p>
                    <div id="saved-games" class="mt-3 flex flex-col gap-1.5 text-xs"></div>
                    <div class="mt-3 flex flex-wrap gap-2">
                        <button type="button" id="upload-button" class="btn btn-primary btn-compact text-xs">Upload match export</button>
                        <button type="button" id="sample-button" class="btn btn-secondary btn-compact text-xs">Open sample</button>
                        <input id="file-input" type="file" accept=".xml,.json,application/json,text/xml,application/xml" class="hidden" aria-label="Match export">
                    </div>
                    <p id="status" class="help-text mt-2 text-xs" role="status"></p>
                </details>

                <!-- Analysis Workspace: Video (sticky) + Filtered Entries -->
                <div id="report"></div>
            </div>
        </main>
    </div>
    <script type="module" src="./page.js"></script>
</body>

</html>
