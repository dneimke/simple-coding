# This workflow will run tests and upload code coverage
name: CI with Code Coverage

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Type Check (tsc)
      run: npm run typecheck

    - name: Run Jest tests with coverage
      run: npm run test:ci -- --json --outputFile=test-results.json

    - name: Write unit test summary
      if: ${{ !cancelled() }}
      run: node scripts/test-summary.js test-results.json coverage/coverage-summary.json

    - name: Codebase audit & health (Fallow)
      if: ${{ !cancelled() }}
      run: |
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Guardrails & Type Safety" >> $GITHUB_STEP_SUMMARY
        echo ":white_check_mark: **Type Check:** \`tsc -p jsconfig.json\` passed with 0 errors." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        AUDIT_STATUS=0
        npx fallow audit --format github-summary >> $GITHUB_STEP_SUMMARY || AUDIT_STATUS=$?
        echo "" >> $GITHUB_STEP_SUMMARY
        npx fallow health --report-only --format github-summary >> $GITHUB_STEP_SUMMARY || true
        if [ $AUDIT_STATUS -ne 0 ]; then
          echo "::error::Fallow audit detected introduced quality gate violations."
          exit $AUDIT_STATUS
        fi

    - name: Upload coverage reports to Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage/
        retention-days: 7
