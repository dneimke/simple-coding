# Version updates wait 7 days after a release is published.
# Security updates are not delayed.
# Minor and patch updates are grouped by manifest section. Majors stay individual.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Adelaide
    open-pull-requests-limit: 3
    assignees:
      - "dneimke"
    cooldown:
      default-days: 7
    groups:
      npm-production-minor-and-patch:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-development-minor-and-patch:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Australia/Adelaide
    open-pull-requests-limit: 2
    assignees:
      - "dneimke"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
