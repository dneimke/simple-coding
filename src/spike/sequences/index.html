<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1220">
    <title>Sequence trial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../styles.css?v=20261020c">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/icons/favicon-32x32.png">
</head>

<body>
    <div class="app-shell">
        <main class="app-main">
            <div class="page" id="sequence-spike">
                <header class="page-header">
                    <div>
                        <h1 class="page-title">Sequence trial</h1>
                        <p class="page-subtitle">Group a coded match into chains. Coding and match review stay as they are.</p>
                    </div>
                    <a class="btn btn-secondary" href="../../index.html#saved-games">Matches</a>
                </header>

                <section class="surface surface-padded mb-4">
                    <h2 class="section-title">Choose a match</h2>
                    <p class="help-text">Use a match saved in this browser, upload an export, or open the sample. A saved match keeps the original times. An export uses the middle of each clip.</p>
                    <div id="saved-games" class="mt-4 flex flex-col gap-2"></div>
                    <div class="mt-4 flex flex-wrap gap-2">
                        <button type="button" id="upload-button" class="btn btn-primary">Upload match export</button>
                        <button type="button" id="sample-button" class="btn btn-secondary">Open sample</button>
                        <input id="file-input" type="file" accept=".xml,.json,application/json,text/xml,application/xml" class="hidden" aria-label="Match export">
                    </div>
                    <p id="status" class="help-text mt-4" role="status"></p>
                </section>

                <div id="report"></div>
            </div>
        </main>
    </div>
    <script type="module" src="./page.js"></script>
</body>

</html>
